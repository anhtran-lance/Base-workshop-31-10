<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lộ trình triển khai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#0068FF;--ink:#0F172A;--body:#475569;--line:#E2E8F0;--tint:#EEF3FF;--shell:#F7F8FB}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:var(--shell);color:var(--body);line-height:1.62}
main{max-width:1120px;margin:0 auto;padding:96px 24px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:9999px;background:var(--tint);color:var(--primary);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.eyebrow:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary)}
h1{font-size:48px;line-height:1.15;letter-spacing:-.02em;font-weight:700;color:var(--ink);margin:20px 0 16px}
.card{margin-top:40px;padding:24px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(12,20,46,.05),0 12px 28px -16px rgba(12,20,46,.3)}
@media(max-width:640px){main{padding:56px 16px}h1{font-size:34px}}
</style>
</head>
<body>
<main>
<span class="eyebrow">Lộ trình</span>
<h1>Lộ trình triển khai</h1>
<p>Các giai đoạn, mốc thời gian và người phụ trách.</p>
<div class="card"><b>Đang soạn.</b> Nội dung sẽ được cập nhật trong thư mục <code>lo-trinh/public</code> của repo.</div>
</main>
</body>
</html>
